<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="L-I-F-E — Living IN FULL Ecosystem. Coming 30 January 2027 at 3:00 PM UK time." />
  <title>L-I-F-E — Coming Soon</title>
  <style>
    :root { --bg:#000; --fg:#fff; }
    * { box-sizing:border-box; }
    html, body { width:100%; min-height:100%; margin:0; background:var(--bg); color:var(--fg); }
    body { min-height:100svh; font-family:Arial, Helvetica, sans-serif; overflow-x:hidden; }
    main {
      min-height:100svh; width:100%; display:grid; place-items:center;
      padding:max(24px, env(safe-area-inset-top))
              max(18px, env(safe-area-inset-right))
              max(24px, env(safe-area-inset-bottom))
              max(18px, env(safe-area-inset-left));
    }
    .holding { width:min(1100px,100%); text-align:center; }
    .brand {
      margin:0; font-size:clamp(4rem,15vw,11rem); font-weight:800; line-height:.9;
      letter-spacing:clamp(.08em,1.3vw,.18em); white-space:nowrap;
    }
    .coming {
      margin:clamp(20px,4vh,42px) 0 0; font-size:clamp(1.35rem,4.4vw,3.8rem);
      font-weight:700; letter-spacing:clamp(.12em,1vw,.26em); text-transform:uppercase;
    }
    .countdown { margin-top:clamp(34px,8vh,76px); }
    .days {
      margin:0; font-size:clamp(8rem,35vw,23rem); font-weight:800; line-height:.72;
      letter-spacing:-.045em; font-variant-numeric:tabular-nums;
    }
    .days-label {
      margin-top:clamp(28px,5vh,54px); font-size:clamp(1.45rem,5vw,4.2rem);
      font-weight:800; letter-spacing:clamp(.10em,1vw,.22em); text-transform:uppercase;
    }
    .date {
      margin-top:clamp(28px,5vh,54px); font-size:clamp(.95rem,2.3vw,1.7rem); letter-spacing:.08em;
    }
    .launch { display:none; width:min(1200px,100%); text-align:center; }
    .launch.active { display:block; }
    .launch-title { margin:0 0 28px; font-size:clamp(3rem,9vw,7rem); letter-spacing:.12em; }
    .video-wrap { width:100%; aspect-ratio:16/9; background:#000; }
    video { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
    .video-fallback { margin-top:18px; font-size:clamp(1rem,2.5vw,1.4rem); }
    @media (max-width:480px) {
      main { padding-left:12px; padding-right:12px; }
      .brand { font-size:clamp(3.4rem,18vw,5.7rem); letter-spacing:.06em; }
      .coming { font-size:clamp(1.05rem,6.3vw,1.7rem); letter-spacing:.12em; }
      .days { font-size:clamp(8.4rem,47vw,13rem); }
      .days-label { font-size:clamp(1.18rem,7vw,2rem); letter-spacing:.09em; }
      .date { font-size:clamp(.86rem,4.4vw,1.05rem); }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; }
    }
  </style>
</head>
<body>
  <main>
    <section id="holding" class="holding" aria-labelledby="life-title">
      <h1 id="life-title" class="brand">L-I-F-E</h1>
      <p class="coming">Coming Soon</p>
      <div class="countdown" aria-live="polite" aria-atomic="true">
        <p id="days" class="days">---</p>
        <div class="days-label">Days To Go</div>
      </div>
      <p class="date">30 January 2027 · 3:00 PM UK time</p>
    </section>
    <section id="launch" class="launch" aria-labelledby="launch-title">
      <h1 id="launch-title" class="launch-title">L-I-F-E</h1>
      <div class="video-wrap">
        <video id="launch-video" controls playsinline preload="metadata">
          <source src="app-launch.mp4" type="video/mp4" />
          Your browser does not support the LIFE launch video.
        </video>
      </div>
      <p class="video-fallback">The LIFE app presentation will appear here after the countdown ends.</p>
    </section>
  </main>
  <script>
    (function () {
      const launchTime = new Date("2027-01-30T15:00:00Z").getTime();
      const holding = document.getElementById("holding");
      const launch = document.getElementById("launch");
      const daysNode = document.getElementById("days");
      let timer = null;
      function updateCountdown() {
        const remaining = launchTime - Date.now();
        if (remaining <= 0) {
          holding.hidden = true;
          launch.classList.add("active");
          if (timer) clearInterval(timer);
          return;
        }
        const dayMs = 24 * 60 * 60 * 1000;
        const days = Math.ceil(remaining / dayMs);
        daysNode.textContent = String(days);
        document.title = `L-I-F-E — ${days} Days To Go`;
      }
      updateCountdown();
      timer = setInterval(updateCountdown, 60000);
    })();
  </script>
</body>
</html>
